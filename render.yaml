services:
  - type: web
    name: gallo-ingest
    runtime: docker
    # standard = 2 GB. Starter's 512 MB is too tight: the catalogue metadata alone
    # is ~165 MB in memory (69,627 rows), and a spreadsheet merge, upload or zip on
    # top of it can make Render kill and restart the server. The likely cause of
    # the intermittent "Unexpected token '<'" errors reported 2026-09-17. Changing this line
    # only takes effect if the service is synced from this Blueprint; otherwise
    # set Instance Type in the dashboard to match.
    plan: standard
    region: frankfurt # closest to eu-north-1 S3 and EU FileMaker hosts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_TMP_DIR
        value: /tmp/gallo-uploads
      # YouTube video tab: back on hosted (2026-09-17) now the plan is standard
      # (2 GB) — its 1080p ffmpeg encodes OOM'd the old 512 MB starter plan.
      # One render at a time; the faster x264 preset keeps a full-length
      # art-track on the single hosted CPU to a sensible wait.
      - key: YOUTUBE_ENABLED
        value: "true"
      - key: YT_X264_PRESET
        value: veryfast
      - key: INGEST_ADMIN_SECRET
        sync: false
      # The Vision Utility's upload / zip-download / rename work here. DELETE
      # does not: Vision has no trash, so a wrong click from anywhere with the
      # admin password destroys a master. Deleting is local-GalloIngest-only
      # unless you deliberately set VISION_DELETE_ENABLED=true here.
      - key: VISION_DELETE_ENABLED
        value: "false"
      # FileMaker — Gallo Catalogue
      - key: GALLO_FM_HOST
        value: https://digitalcupboard.app
      - key: GALLO_FM_DB
        value: Gallo Catalogue
      - key: GALLO_FM_USER
        sync: false
      - key: GALLO_FM_PASS
        sync: false
      - key: GALLO_FM_LAYOUT
        value: API_Album_Songs
      - key: GALLO_FM_TAPE_LAYOUT
        value: API_Tape_Files
      # FileMaker — Gallo CMS 2024 (user/pass fall back to GALLO_FM_*)
      - key: CMS2024_FM_HOST
        value: https://digitalcupboard.app
      - key: CMS2024_FM_DB
        value: Gallo CMS 2024
      - key: CMS2024_FM_LAYOUT
        value: Song Files
      # FileMaker — MadStreamer
      - key: MADSTREAMER_FM_HOST
        value: digitalcupboard.fmcloud.fm
      - key: MADSTREAMER_FM_DB
        value: MadStreamer
      # AWS / S3
      - key: AWS_REGION
        value: eu-north-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_IMPORTS_BUCKET
        value: mass-music-audio-files
      - key: S3_IMPORTS_PREFIX
        value: AudioImports/
      - key: S3_IMPORTS_BASE_URL
        value: https://mass-music-audio-files.s3.eu-north-1.amazonaws.com
      # Postgres READ mirror of MadStreamer — powers the Data Health tab only.
      # This is the MAD website's database; GalloIngest only ever reads it
      # (lib/mirror-db.js refuses any statement that is not SELECT/WITH).
      # Use the INTERNAL Database URL: that Postgres is in frankfurt and so is
      # this service, so private networking applies — faster and no SSL setup.
      # Leave it unset and the Data Health tab simply says "not configured";
      # nothing else in GalloIngest is affected.
      - key: MIRROR_DATABASE_URL
        sync: false
      # FileMaker server-side asset path
      - key: FM_SERVER_ASSET_PATH
        value: /Macintosh HD/Users/fmuser/Documents/Vision.localized/gallo-music-files-wavs
