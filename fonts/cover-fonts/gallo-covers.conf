<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Generated-cover fonts for the hosted (Linux) server — the Make Cover tab (Ian, 2026-10-15: "we need to make covers
  from the hosted site"). The designs in lib/cover-template.js / lib/cover-styles.js name macOS fonts, which Linux
  does not have and may not be redistributed. This file points each of those names at a free (SIL OFL) look-alike
  bundled next to it. The Mac never reads this file, so covers made there keep the real fonts.
  Installed by the Dockerfile into /etc/fonts/conf.d.
-->
<fontconfig>
  <dir>/app/fonts/cover-fonts</dir>
  <alias binding="same"><family>Didot</family><prefer><family>Playfair Display</family></prefer></alias>
  <alias binding="same"><family>Avenir Next Condensed</family><prefer><family>Barlow Condensed</family></prefer></alias>
  <alias binding="same"><family>DIN Condensed</family><prefer><family>Barlow Condensed</family></prefer></alias>
  <alias binding="same"><family>Bodoni 72</family><prefer><family>Bodoni Moda</family></prefer></alias>
  <alias binding="same"><family>Bodoni 72 Smallcaps</family><prefer><family>Bodoni Moda</family></prefer></alias>
  <alias binding="same"><family>Rockwell</family><prefer><family>Arvo</family></prefer></alias>
  <alias binding="same"><family>Copperplate</family><prefer><family>Cinzel</family></prefer></alias>
  <alias binding="same"><family>Bodoni Ornaments</family><prefer><family>Noto Sans Symbols 2</family></prefer></alias>
</fontconfig>
